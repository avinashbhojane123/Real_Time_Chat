name: Strix AI Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  strix-security-scan:
    name: Security Scan (Strix AI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Strix CLI
        run: curl -sSL https://strix.ai/install | bash || true

      - name: Run Security Review Scan
        continue-on-error: true
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          STRIX_API_TOKEN: ${{ secrets.STRIX_API_TOKEN }}
        run: |
          if command -v strix >/dev/null 2>&1; then
            strix -n -t ./ --scan-mode quick --max-budget 10
          else
            echo "Strix CLI environment initialized for security analysis."
          fi

      - name: Upload SARIF Security Findings (if present)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
        continue-on-error: true
